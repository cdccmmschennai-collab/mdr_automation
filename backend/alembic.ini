# Alembic configuration.
#
# There is deliberately no `sqlalchemy.url` here. The URL carries a host, a
# username and a password, and this file is committed. `alembic/env.py` reads it
# from `MDR_DATABASE_URL` (or `DATABASE_URL`) through the application's own
# settings, so the migrations and the application can never be pointed at two
# different databases by accident.
#
# Run from `backend/`:
#
#     alembic upgrade head        # apply every migration
#     alembic downgrade -1        # step back one
#     alembic current             # what this database is at

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Timestamped, ordered filenames: `20260909_1430-a1b2c3_add_x.py`.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

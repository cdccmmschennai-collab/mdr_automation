[project]
name = "mdr-automation-backend"
version = "0.2.0"
description = "MDR Automation Tool - backend: MDR engine, domain and API"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    # Multipart form parsing, for POST /api/v1/mdr/upload.
    "python-multipart>=0.0.9",
    # Persistence (Delivery Phase 2). `psycopg[binary]` ships the driver
    # without a local libpq/compiler; a deployment that prefers the system
    # libpq installs plain `psycopg` instead.
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
# httpx backs fastapi.testclient, which the API contract tests use.
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
mdr-engine = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# `backend/` on the import path, so `app.*` and `tests.support.*` resolve
# whether pytest is run from backend/ or from the repository root.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

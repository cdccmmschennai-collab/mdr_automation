# Local development stack. `docker compose up --build` starts everything the
# tool needs locally - PostgreSQL, the API and the frontend dev server - and
# nothing else has to be started by hand.
#
# This is NOT a production deployment: the API is unauthenticated, the backend
# runs with --reload, and the frontend runs the Vite dev server. Production
# deployment is Phase 7.
#
# Data is bind-mounted read-only where the engine only reads, so a container
# cannot modify a source workbook even by accident.
#
#   frontend   host 3200 -> container 3000
#   backend    host 8200 -> container 8000
#   postgres   internal 5432 only, not published to the host

# Explicit, so container and volume names do not depend on the directory the
# repository happens to be checked out into.
name: mdr-automation

services:
  # Minimal on purpose: one service, one named volume, no tuning and no init
  # scripts. The schema comes from Alembic (`alembic upgrade head` from
  # backend/), never from a SQL file dropped into the entrypoint, so a
  # container and a managed PostgreSQL are built the same way.
  postgres:
    image: postgres:16-alpine
    container_name: mdr-automation-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mdr}
      # Development default. A deployment supplies its own; this file is
      # committed and must never carry a real one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdr}
      POSTGRES_DB: ${POSTGRES_DB:-mdr}
    volumes:
      # Named, so the database survives `docker compose down`.
      - mdr-postgres-data:/var/lib/postgresql/data
    # No `ports`: only the backend talks to it, over the compose network, and
    # an unpublished port cannot collide with a PostgreSQL already on the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mdr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mdr-automation-backend
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      MDR_DATA_DIR: /data
      MDR_LOG_LEVEL: ${MDR_LOG_LEVEL:-INFO}
      # The browser origin of the frontend in this stack, i.e. the published
      # host port - not the port inside the frontend container.
      MDR_CORS_ORIGINS: http://localhost:3200,http://127.0.0.1:3200
      # `postgres` is the compose service name, resolved on the compose
      # network. Never localhost: that would be the backend container itself.
      MDR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mdr}:${POSTGRES_PASSWORD:-mdr}@postgres:5432/${POSTGRES_DB:-mdr}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data/input:/data/input:ro
      - ./data/reference:/data/reference:ro
      - ./data/rules:/data/rules:ro
      - ./data/received:/data/received:ro
      - ./data/output:/data/output
    ports:
      - "8200:8000"

  frontend:
    image: node:22-alpine
    container_name: mdr-automation-frontend
    working_dir: /app
    # --port is set here rather than in vite.config.ts so a developer running
    # `npm run dev` outside Docker keeps Vite's own default. --strictPort makes
    # a taken port fail loudly instead of silently moving off 3000, which the
    # 3200:3000 mapping would then miss.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000 --strictPort"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      # Anonymous volume: container-built node_modules, not the host's.
      - /app/node_modules
    ports:
      - "3200:3000"
    depends_on:
      - backend

volumes:
  mdr-postgres-data:
